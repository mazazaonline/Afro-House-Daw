name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q AfroHouseDAW.zip
      - name: Fix slider line
        run: |
          sed -i 's/Slider(Modifier.weight(1f).padding(start = 8.dp), value/Slider(modifier = Modifier.weight(1f).padding(start = 8.dp), value/' AfroHouseDAW/app/src/main/java/com/afrohouse/daw/MainActivity.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
          build-root-directory: AfroHouseDAW
      - run: gradle assembleDebug --no-daemon
        working-directory: AfroHouseDAW
      - uses: actions/upload-artifact@v4
        with:
          name: AfroDAW-debug-apk
          path: AfroHouseDAW/app/build/outputs/apk/debug/*.apk
